name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        # The job does not install the coreai extra. Its wheels need macOS 26 or later and its runtime needs macOS 27, so the Core AI tests skip.
        run: uv sync --python 3.12 --extra onnx-cpu --extra openvino --extra executorch ${{ matrix.os == 'macos-latest' && '--extra coreml' || '' }} --group dev
      - name: Test
        run: uv run pytest -q
